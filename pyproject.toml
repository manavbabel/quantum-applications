[project]
name = "quantum-applications"
version = "0.1.0"
description = "Demonstration of various applications of quantum algorithms"
readme = "README.md"
authors = [
    { name = "Manav Babel", email = "manavbabel@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dimod>=0.12.22",
    "dwave-samplers>=1.8.0",
    "dwave-system>=1.35.0",
    "gurobipy>=13.0.3",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "minorminer>=0.2.22",
    "numba>=0.68.0",
    "numpy>=2.5.3",
    "qiskit>=2.5.2",
    "qiskit-aer>=0.17.2",
    "qiskit-ibm-runtime>=0.49.0",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 110
