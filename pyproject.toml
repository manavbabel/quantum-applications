[project]
name = "quantum-applications"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Manav Babel", email = "manavbabel@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dwave-ocean-sdk>=9.4.0",
    "gurobipy>=13.0.3",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "nbconvert>=7.17.1",
    "qiskit>=2.5.2",
    "qiskit-aer>=0.17.2",
    "qiskit-ibm-runtime>=0.49.0",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
# cuTensorNet needs an NVIDIA GPU + CUDA: `uv sync --extra gpu` on a GPU box.
gpu = ["cuquantum-python>=25.3.0"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
